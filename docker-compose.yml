version: '3.8'

services:
  # NGINX reverse proxy for AppFlowy
  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "${NGINX_PORT:-80}:80"
      - "${NGINX_TLS_PORT:-443}:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - appflowy_cloud
    networks:
      - appflowy_network
    labels:
      - "coolify.managed=true"
      - "traefik.enable=true"
      - "traefik.http.routers.appflowy.rule=Host(`${APPFLOWY_DOMAIN:-localhost}`)"
      - "traefik.http.routers.appflowy.entrypoints=websecure"
      - "traefik.http.routers.appflowy.tls.certresolver=letsencrypt"
      - "traefik.http.services.appflowy.loadbalancer.server.port=80"

  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-appflowy}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - appflowy_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    labels:
      - "coolify.managed=true"

  # Redis for caching
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis_password}
    volumes:
      - redis_data:/data
    networks:
      - appflowy_network
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    labels:
      - "coolify.managed=true"

  # MinIO for S3-compatible object storage
  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MINIO_BROWSER_REDIRECT_URL: ${MINIO_BROWSER_REDIRECT_URL:-http://localhost:9001}
    volumes:
      - minio_data:/data
    networks:
      - appflowy_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    labels:
      - "coolify.managed=true"

  # GoTrue for authentication
  gotrue:
    image: supabase/gotrue:latest
    restart: unless-stopped
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-password}@postgres:${POSTGRES_PORT:-5432}/${POSTGRES_DB:-appflowy}?sslmode=disable
      GOTRUE_SITE_URL: ${GOTRUE_SITE_URL:-http://localhost}
      GOTRUE_URI_ALLOW_LIST: ${GOTRUE_URI_ALLOW_LIST:-*}
      GOTRUE_JWT_SECRET: ${GOTRUE_JWT_SECRET:-your-super-secret-jwt-token-with-at-least-32-characters}
      GOTRUE_JWT_EXP: ${GOTRUE_JWT_EXP:-3600}
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_MAILER_AUTOCONFIRM: ${GOTRUE_MAILER_AUTOCONFIRM:-true}
      GOTRUE_SMTP_HOST: ${GOTRUE_SMTP_HOST:-}
      GOTRUE_SMTP_PORT: ${GOTRUE_SMTP_PORT:-587}
      GOTRUE_SMTP_USER: ${GOTRUE_SMTP_USER:-}
      GOTRUE_SMTP_PASS: ${GOTRUE_SMTP_PASS:-}
      GOTRUE_SMTP_ADMIN_EMAIL: ${GOTRUE_SMTP_ADMIN_EMAIL:-admin@example.com}
      GOTRUE_EXTERNAL_EMAIL_ENABLED: ${GOTRUE_EXTERNAL_EMAIL_ENABLED:-true}
      GOTRUE_DISABLE_SIGNUP: ${GOTRUE_DISABLE_SIGNUP:-false}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - appflowy_network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9999/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    labels:
      - "coolify.managed=true"

  # AppFlowy Cloud Application
  appflowy_cloud:
    image: appflowyinc/appflowy_cloud:latest
    restart: unless-stopped
    environment:
      RUST_LOG: ${RUST_LOG:-info}
      APPFLOWY_ENVIRONMENT: ${APPFLOWY_ENVIRONMENT:-production}
      APPFLOWY_DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-password}@postgres:${POSTGRES_PORT:-5432}/${POSTGRES_DB:-appflowy}?sslmode=disable
      APPFLOWY_REDIS_URL: redis://:${REDIS_PASSWORD:-redis_password}@redis:6379
      APPFLOWY_GOTRUE_URL: http://gotrue:9999
      APPFLOWY_S3_BUCKET: ${APPFLOWY_S3_BUCKET:-appflowy}
      APPFLOWY_S3_REGION: ${APPFLOWY_S3_REGION:-us-east-1}
      APPFLOWY_S3_USE_MINIO: ${APPFLOWY_S3_USE_MINIO:-true}
      APPFLOWY_S3_MINIO_URL: http://minio:9000
      APPFLOWY_S3_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      APPFLOWY_S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      APPFLOWY_MAILER_SMTP_HOST: ${APPFLOWY_MAILER_SMTP_HOST:-}
      APPFLOWY_MAILER_SMTP_PORT: ${APPFLOWY_MAILER_SMTP_PORT:-587}
      APPFLOWY_MAILER_SMTP_USERNAME: ${APPFLOWY_MAILER_SMTP_USERNAME:-}
      APPFLOWY_MAILER_SMTP_PASSWORD: ${APPFLOWY_MAILER_SMTP_PASSWORD:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      gotrue:
        condition: service_healthy
    networks:
      - appflowy_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    labels:
      - "coolify.managed=true"

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  minio_data:
    driver: local

networks:
  appflowy_network:
    driver: bridge
